{#
  Line icons for menus and buttons (P1-UI-02): simple shapes drawn for this portal, 20 px,
  using the current text colour. Decorative only: the text beside them carries the meaning.
  Add a new icon here and name it in app/core/navigation.py.
#}
{% macro icon(name) %}
<svg class="icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {% if name == "grid" %}
  <rect x="3" y="3" width="5.5" height="5.5" rx="1.5"/><rect x="11.5" y="3" width="5.5" height="5.5" rx="1.5"/>
  <rect x="3" y="11.5" width="5.5" height="5.5" rx="1.5"/><rect x="11.5" y="11.5" width="5.5" height="5.5" rx="1.5"/>
  {% elif name == "users" %}
  <circle cx="7.5" cy="7" r="3"/><path d="M2.5 16.5c.6-2.8 2.6-4.3 5-4.3s4.4 1.5 5 4.3"/>
  <path d="M13 4.3a3 3 0 0 1 0 5.4M14.8 12.6c1.4.6 2.4 1.9 2.7 3.9"/>
  {% elif name == "swatch" %}
  <rect x="3" y="3" width="6" height="14" rx="2"/><path d="M9 7.5l4-2.3 3 5.2-7 4"/><circle cx="6" cy="13.5" r="1"/>
  {% elif name == "chevron" %}
  <path d="M7.5 4.5 13 10l-5.5 5.5"/>
  {% elif name == "menu" %}
  <path d="M3.5 6h13M3.5 10h13M3.5 14h13"/>
  {% elif name == "shield" %}
  <path d="M10 2.8 4 5.2v4.3c0 3.7 2.5 6.4 6 7.7 3.5-1.3 6-4 6-7.7V5.2z"/><path d="m7.3 10 1.9 1.9 3.6-3.8"/>
  {% elif name == "sign-out" %}
  <path d="M8 3.5H5a1.5 1.5 0 0 0-1.5 1.5v10A1.5 1.5 0 0 0 5 16.5h3M12.5 13.5 16 10l-3.5-3.5M16 10H8"/>
  {% endif %}
</svg>
{% endmacro %}
