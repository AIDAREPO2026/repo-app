{#
  Line icons for menus and buttons (P1-UI-02): simple shapes drawn for this portal, 20 px,
  using the current text colour. Decorative only: the text beside them carries the meaning.
  Add a new icon here and name it in app/core/navigation.py.
#}
{% macro icon(name) %}
<svg class="icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {% if name == "grid" %}
  <rect x="3" y="3" width="5.5" height="5.5" rx="1.5"/><rect x="11.5" y="3" width="5.5" height="5.5" rx="1.5"/>
  <rect x="3" y="11.5" width="5.5" height="5.5" rx="1.5"/><rect x="11.5" y="11.5" width="5.5" height="5.5" rx="1.5"/>
  {% elif name == "users" %}
  <circle cx="7.5" cy="7" r="3"/><path d="M2.5 16.5c.6-2.8 2.6-4.3 5-4.3s4.4 1.5 5 4.3"/>
  <path d="M13 4.3a3 3 0 0 1 0 5.4M14.8 12.6c1.4.6 2.4 1.9 2.7 3.9"/>
  {% elif name == "swatch" %}
  <rect x="3" y="3" width="6" height="14" rx="2"/><path d="M9 7.5l4-2.3 3 5.2-7 4"/><circle cx="6" cy="13.5" r="1"/>
  {% elif name == "chevron" %}
  <path d="M7.5 4.5 13 10l-5.5 5.5"/>
  {% elif name == "menu" %}
  <path d="M3.5 6h13M3.5 10h13M3.5 14h13"/>
  {% elif name == "building" %}
  <path d="M3.5 16.5h13M5 16.5V4.5a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v12M12 8h2a1 1 0 0 1 1 1v7.5"/>
  <path d="M7.5 6.5h2M7.5 9.5h2M7.5 12.5h2"/>
  {% elif name == "shield" %}
  <path d="M10 2.8 4 5.2v4.3c0 3.7 2.5 6.4 6 7.7 3.5-1.3 6-4 6-7.7V5.2z"/><path d="m7.3 10 1.9 1.9 3.6-3.8"/>
  {% elif name == "sign-out" %}
  <path d="M8 3.5H5a1.5 1.5 0 0 0-1.5 1.5v10A1.5 1.5 0 0 0 5 16.5h3M12.5 13.5 16 10l-3.5-3.5M16 10H8"/>
  {% elif name == "document" %}
  <path d="M11.5 2.8H6a1.5 1.5 0 0 0-1.5 1.5v11.4A1.5 1.5 0 0 0 6 17.2h8a1.5 1.5 0 0 0 1.5-1.5V6.8z"/>
  <path d="M11.5 2.8v4h4M7.5 10.5h5M7.5 13.5h3.5"/>
  {% elif name == "lock" %}
  <rect x="4" y="8.5" width="12" height="8.5" rx="1.8"/><path d="M6.8 8.5V6.2a3.2 3.2 0 0 1 6.4 0v2.3M10 12v2"/>
  {% elif name == "inbox" %}
  <path d="M3.5 11.5 5.6 4.6a1.5 1.5 0 0 1 1.4-1.1h6a1.5 1.5 0 0 1 1.4 1.1l2.1 6.9v4a1.5 1.5 0 0 1-1.5 1.5H5a1.5 1.5 0 0 1-1.5-1.5z"/>
  <path d="M3.5 11.5h3.8l1 2h3.4l1-2h3.8"/>
  {% elif name == "close" %}
  <path d="M5 5l10 10M15 5 5 15"/>
  {% elif name == "sun" %}
  <circle cx="10" cy="10" r="3.4"/>
  <path d="M10 2.5v1.8M10 15.7v1.8M2.5 10h1.8M15.7 10h1.8M4.7 4.7 6 6M14 14l1.3 1.3M15.3 4.7 14 6M6 14l-1.3 1.3"/>
  {% elif name == "moon" %}
  <path d="M16.5 12.2A7 7 0 0 1 7.8 3.5a7 7 0 1 0 8.7 8.7z"/>
  {% elif name == "home" %}
  <path d="M3.5 8.8 10 3.5l6.5 5.3v6.7a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/><path d="M8 16.5v-5h4v5"/>
  {% elif name == "chevron-down" %}
  <path d="M5 7.8 10 12.5l5-4.7"/>
  {% elif name == "check" %}
  <path d="m4.5 10.5 3.5 3.5 7.5-8"/>
  {% elif name == "sidebar" %}
  <rect x="3" y="3.5" width="14" height="13" rx="2.5"/><path d="M8 3.5v13"/>
  {% elif name == "search" %}
  <circle cx="8.8" cy="8.8" r="5.3"/><path d="m12.8 12.8 4 4"/>
  {% elif name == "plus" %}
  <path d="M10 4.5v11M4.5 10h11"/>
  {% elif name == "upload" %}
  <path d="M10 13V3.8M6.5 7.2 10 3.7l3.5 3.5M4 12.5v3a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-3"/>
  {% elif name == "edit" %}
  <path d="M13.2 3.8a1.8 1.8 0 0 1 2.6 2.6L7 15.2l-3.5 1 1-3.5z"/><path d="m11.8 5.2 3 3"/>
  {% elif name == "mail" %}
  <rect x="3" y="4.5" width="14" height="11" rx="2"/><path d="m3.5 6 6.5 5 6.5-5"/>
  {% elif name == "swap" %}
  <path d="M4 7h11.5M12.5 4l3 3-3 3M16 13H4.5M7.5 10l-3 3 3 3"/>
  {% elif name == "refresh" %}
  <path d="M15.8 8.5A6 6 0 1 0 16 10.8M16 4v4.5h-4.5"/>
  {% elif name == "user-minus" %}
  <circle cx="8" cy="7" r="3"/><path d="M3 16.5c.6-2.8 2.6-4.3 5-4.3s4.4 1.5 5 4.3M13 8h5"/>
  {% elif name == "power" %}
  <path d="M10 3v6.5M6.2 5.5a6 6 0 1 0 7.6 0"/>
  {% elif name == "arrow-left" %}
  <path d="M16 10H4.5M9 5.5 4.5 10 9 14.5"/>
  {% elif name == "sign-in" %}
  <path d="M12 3.5h3a1.5 1.5 0 0 1 1.5 1.5v10a1.5 1.5 0 0 1-1.5 1.5h-3M8 13.5l3.5-3.5L8 6.5M11.5 10h-8"/>
  {% elif name == "phone" %}
  <rect x="5.5" y="2.8" width="9" height="14.4" rx="2"/><path d="M9 14.5h2"/>
  {% elif name == "info" %}
  <circle cx="10" cy="10" r="7"/><path d="M10 9.2v4M10 6.8v.1"/>
  {% elif name == "warning" %}
  <path d="M10 3.5 17.2 16H2.8z"/><path d="M10 8.5v3.2M10 13.9v.1"/>
  {% elif name == "error" %}
  <circle cx="10" cy="10" r="7"/><path d="m7.5 7.5 5 5M12.5 7.5l-5 5"/>
  {% elif name == "arrow-right" %}
  <path d="M4 10h11.5M11 5.5l4.5 4.5-4.5 4.5"/>
  {% endif %}
</svg>
{% endmacro %}
