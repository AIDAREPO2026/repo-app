[project]
name = "aida-repo-app"
version = "0.0.1"
description = "Digital Resource Repository for DISCOMs (AIDA)"
requires-python = ">=3.12"

# Approved runtime libraries only (docs/architecture.md). Pinned exactly so
# every developer, CI and the servers run the same code. Add a library only
# with tech lead approval, and update docs/architecture.md in the same PR.
# The ALTCHA server library is added once P0-SEC-01 confirms it.
dependencies = [
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "boto3==1.44.12",
    "celery==5.7.0",
    "cryptography==50.0.2",
    "fastapi==0.165.0",
    "httpx==0.29.0",
    "jinja2==3.1.6",
    "openpyxl==3.1.5",
    "psycopg[binary]==3.3.9",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "pyotp==2.12.2",
    "pypdf==7.2.0",
    "python-magic==0.4.27",
    "python-multipart==0.0.34",
    "qrcode==8.2",
    "redis==8.2.0",
    "sqlalchemy==2.1.9",
    "uvicorn==0.54.0",
]

[dependency-groups]
# Installed by `uv sync` on developer machines and CI, never on servers
# (`uv sync --no-dev`). Playwright and Locust join with the first e2e and
# load tests.
dev = [
    "mypy==2.4.1",
    "pip-audit==2.10.1",
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[tool.uv]
# The app is deployed from source, never published as a package, so uv
# skips building it.
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# C90: complexity. Any function above 10 fails the build (docs/conventions.md).
select = ["E", "F", "W", "I", "B", "UP", "S", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Plain assert is how pytest tests are written.
"tests/**" = ["S101"]
# Models modules are imported only so Alembic sees their tables.
"migrations/env.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import `app` without installing the project as a package.
pythonpath = ["."]
addopts = "-ra"
