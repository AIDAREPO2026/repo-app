# The only public entry point. Runs unprivileged, so it listens on 8080 and 8443;
# Compose maps them to 80 and 443 on the host.

upstream app {
    server app:8000;
}

upstream tusd {
    server tusd:8080;
}

# Basic per-address limits for sign-in and search (security.md). The routes add
# their own limits in the app as well.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=search:10m rate=60r/m;
# P1-ACC-02: registration requests, and the CAPTCHA challenges they need.
limit_req_zone $binary_remote_addr zone=register:10m rate=10r/m;
limit_req_status 429;

server_tokens off;

# HTTP only redirects to HTTPS.
server {
    listen 8080;
    server_name _;

    # For the container health check only.
    location = /nginx-health {
        allow 127.0.0.1;
        deny all;
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/portal-routes.conf;
}
