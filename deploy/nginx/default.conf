# The only public entry point. Runs unprivileged, so it listens on 8080 and 8443;
# Compose maps them to 80 and 443 on the host.

upstream app {
    server app:8000;
}

upstream tusd {
    server tusd:8080;
}

# Basic per-address limits for sign-in and search (security.md). The routes add
# their own limits in the app as well.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=search:10m rate=60r/m;
limit_req_status 429;

server_tokens off;

# HTTP only redirects to HTTPS.
server {
    listen 8080;
    server_name _;

    # For the container health check only.
    location = /nginx-health {
        allow 127.0.0.1;
        deny all;
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Normal forms and pages. Files go through tusd at /files/ instead.
    client_max_body_size 2m;

    include /etc/nginx/snippets/security-headers.conf;

    # App endpoints for internal callers, such as the tusd hooks. Never reachable from outside.
    location /internal/ {
        return 404;
    }

    # Protected files. Reached only through X-Accel-Redirect from the app after its
    # permission check, with a short-lived signed storage URL (P3-VIEW-03). A direct
    # request gets 404, and the storage URL never reaches the browser.
    location /_protected/ {
        internal;
        proxy_pass http://seaweedfs:8333/;
        proxy_set_header Host seaweedfs:8333;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "private, no-store" always;
    }

    # Resumable uploads. One 50 MB chunk per request (RESUMABLE_CHUNK_MB), streamed straight to tusd.
    location /files/ {
        client_max_body_size 51m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://tusd;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /login {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/snippets/proxy-app.conf;
    }

    location /search {
        limit_req zone=search burst=20 nodelay;
        include /etc/nginx/snippets/proxy-app.conf;
    }

    location / {
        include /etc/nginx/snippets/proxy-app.conf;
    }
}
