# Everything the portal serves: the app, uploads, protected files and their limits.
# Included by the HTTPS server in default.conf and, locally, by the plain HTTP
# server in local-http.conf, so both answer exactly the same way.

# Normal forms and pages. Files go through tusd at /files/ instead.
client_max_body_size 2m;

include /etc/nginx/snippets/security-headers.conf;

# App endpoints for internal callers, such as the tusd hooks. Never reachable from outside.
location /internal/ {
    return 404;
}

# Protected files. Reached only through X-Accel-Redirect from the app after its
# permission check, with a short-lived signed storage URL (P3-VIEW-03). A direct
# request gets 404, and the storage URL never reaches the browser.
location /_protected/ {
    internal;
    proxy_pass http://seaweedfs:8333/;
    proxy_set_header Host seaweedfs:8333;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "private, no-store" always;
}

# Resumable uploads. One 50 MB chunk per request (RESUMABLE_CHUNK_MB), streamed straight to tusd.
location /files/ {
    client_max_body_size 51m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_pass http://tusd;
    # $http_host keeps the port, like proxy-app.conf, so upload URLs tusd returns include it.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location /login {
    limit_req zone=login burst=5 nodelay;
    include /etc/nginx/snippets/proxy-app.conf;
}

# P1-ACC-02: the live "is this User ID free" check types faster than the registration limit.
location = /register/user-id {
    limit_req zone=search burst=20 nodelay;
    include /etc/nginx/snippets/proxy-app.conf;
}

location /register {
    limit_req zone=register burst=5 nodelay;
    include /etc/nginx/snippets/proxy-app.conf;
}

location /captcha/ {
    limit_req zone=register burst=10 nodelay;
    include /etc/nginx/snippets/proxy-app.conf;
}

location /search {
    limit_req zone=search burst=20 nodelay;
    include /etc/nginx/snippets/proxy-app.conf;
}

location / {
    include /etc/nginx/snippets/proxy-app.conf;
}
