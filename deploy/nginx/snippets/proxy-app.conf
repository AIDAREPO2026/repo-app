# Pass the request to the app with the details it needs about the original client.
proxy_pass http://app;
# $http_host keeps the port (for example localhost:8081). $host drops it, and the app
# builds its links, such as the stylesheet, from this header.
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
