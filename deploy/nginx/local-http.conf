# Local development only, added by docker-compose.dev.yml: the portal over plain HTTP
# at http://localhost:8081, so no self-signed certificate is needed on a laptop.
# Browsers treat localhost as secure, so the Secure session cookie still works.
# Never mounted on staging or production, where only HTTPS serves the portal.
server {
    listen 8081;
    server_name _;

    include /etc/nginx/snippets/portal-routes.conf;
}
