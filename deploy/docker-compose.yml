# The whole system, the same on every machine. Local development adds
# docker-compose.dev.yml. Secrets come from the .env file at the repository root.
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up
#
# Only nginx publishes ports. Everything else talks on the internal network.

name: aida

# Shared by app, worker and beat, which run the same code.
x-python: &python
  env_file: ../.env
  restart: unless-stopped

services:
  nginx:
    image: nginxinc/nginx-unprivileged:1.30.6-alpine
    restart: unless-stopped
    # Override with HTTP_PORT and HTTPS_PORT in the shell when 80 or 443 are taken locally.
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
      tusd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3

  app:
    <<: *python
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs-bucket:
        condition: service_completed_successfully

  worker:
    <<: *python
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: worker
    depends_on:
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
      seaweedfs-bucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery --app workers.celery_app inspect ping --destination celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3

  beat:
    <<: *python
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: worker
    # The schedule file lives in /tmp, because uid 10001 cannot write to the app folder.
    command: ["celery", "--app", "workers.celery_app", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # Beat has no ping command, so check that it can still reach the broker.
      test: ["CMD", "python", "-c", "from workers.celery_app import celery_app; celery_app.connection().ensure_connection(max_retries=1)"]
      interval: 30s
      timeout: 15s
      start_period: 20s
      retries: 3

  tusd:
    image: tusproject/tusd:v2.10.4
    restart: unless-stopped
    # Reads AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY and AWS_REGION for SeaweedFS.
    env_file: ../.env
    # Uploads land under incoming/ in the bucket. Hooks go to the app on the internal
    # network only; until P2-UPL-01 adds them, every upload is refused at pre-create.
    command:
      - -host=0.0.0.0
      - -port=8080
      - -base-path=/files/
      - -behind-proxy
      - -s3-bucket=aida
      - -s3-endpoint=http://seaweedfs:8333
      - -s3-object-prefix=incoming/
      - -hooks-http=http://app:8000/internal/tusd-hooks
      - -hooks-enabled-events=pre-create,post-finish
      - -hooks-http-forward-headers=Cookie
    depends_on:
      seaweedfs-bucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3

  # S3-compatible file storage (D-14), open-source edition. Only requests signed
  # with the keys in .env are accepted.
  seaweedfs:
    image: chrislusf/seaweedfs:4.55
    restart: unless-stopped
    # The image's own seaweed user, which owns its data folders.
    user: "1000:1000"
    env_file: ../.env
    entrypoint: ["weed"]
    command: ["server", "-dir=/data", "-s3", "-master.volumeSizeLimitMB=1024", "-volume.max=0"]
    volumes:
      - seaweedfs:/data
    depends_on:
      seaweedfs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  # Runs once as root, because a new volume or disk is owned by root, then exits.
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.55
    user: root
    entrypoint: ["chown", "-R", "1000:1000", "/data"]
    volumes:
      - seaweedfs:/data

  # Creates the private bucket on the first start, and does nothing once it exists.
  seaweedfs-bucket:
    image: chrislusf/seaweedfs:4.55
    user: "1000:1000"
    entrypoint:
      - sh
      - -c
      - >
        echo 's3.bucket.list' | weed shell -master=seaweedfs:9333 | grep -q '^  aida[[:space:]]'
        || echo 's3.bucket.create -name aida' | weed shell -master=seaweedfs:9333 | grep 'created bucket aida'
    depends_on:
      seaweedfs:
        condition: service_healthy

  clamav:
    image: clamav/clamav-debian:1.5.5
    restart: unless-stopped
    volumes:
      - clamav:/var/lib/clamav
    healthcheck:
      # The first start downloads the virus signatures, which can take several minutes.
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 10m
      retries: 3

  postgres:
    image: postgres:19.0-trixie
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username $$POSTGRES_USER --dbname $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.8.4-trixie
    restart: unless-stopped
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # Staging and production bind seaweedfs to the encrypted storage disk (P0-OPS-01).
  seaweedfs:
  clamav:
  postgres:
  redis:
